name: Check private source artifact token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private repository access
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SOURCE_ARTIFACT_READ_TOKEN is missing"
            exit 1
          fi
          failed=0
          for repo in LifeCalendar-App CCNAVocabTrainer JugglerCounter; do
            if gh api "repos/ak-0923/$repo/actions/runs?per_page=1" --jq '.total_count' >/dev/null; then
              echo "PASS: $repo Actions read access"
            else
              echo "::error::FAIL: $repo Actions read access"
              failed=1
            fi
          done
          exit "$failed"
