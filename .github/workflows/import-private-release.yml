name: Import verified APK from private Releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-private-release.yml']
  workflow_dispatch:
    inputs:
      app:
        description: App to import
        type: choice
        required: true
        options: [lifecalendar, kuraberu, ccna, juggler]
      expected_certificate_sha256:
        description: Previously verified signing certificate SHA-256
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: apk-import-${{ inputs.app }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest signed APK from private release
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          APP: ${{ inputs.app || 'kuraberu' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          case "$APP" in
            lifecalendar) SOURCE=ak-0923/LifeCalendar-App; TAG=dev-latest; ASSET=LifeCalendar-debug.apk; PACKAGE=com.example.lifecalendar;;
            kuraberu) SOURCE=ak-0923/LifeCalendar-App; TAG=kuraberu-v1.7.1; ASSET=KuraberuExpense-v1.7.1-build34.apk; PACKAGE=jp.kuraberu.expense;;
            ccna) SOURCE=ak-0923/CCNAVocabTrainer; TAG=dev-stable; ASSET=CCNAVocabTrainer-debug.apk; PACKAGE=com.example.ccnavocab;;
            juggler) SOURCE=ak-0923/JugglerCounter; TAG=dev-latest; ASSET=JugglerCounter-debug.apk; PACKAGE=com.example.jugglercounter;;
          esac
          mkdir -p incoming
          gh release download "$TAG" --repo "$SOURCE" --pattern "$ASSET" --dir incoming
          test -s "incoming/$ASSET"
          echo "APK=incoming/$ASSET" >> "$GITHUB_ENV"
          echo "EXPECTED_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify signature, package and version
        env:
          APP: ${{ inputs.app || 'kuraberu' }}
          EXPECTED_CERT: ${{ inputs.expected_certificate_sha256 }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/$(ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          ACTUAL="$(grep -i 'certificate SHA-256 digest:' signer.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL" ]; then
            echo '::error::Cannot parse APK certificate fingerprint; apksigner output follows:'
            grep -i 'certificate.*sha-256\|sha-256.*certificate' signer.txt || true
            exit 1
          fi
          case "$APP" in
            kuraberu) EXPECTED="C256FB0C3933357141F354FC3EF1A75BF4CE5E620534DDAAD7D62AA8B9C694B3";;
            lifecalendar|ccna) EXPECTED="BAF5F76D9A1D97915E85FB0E93C5AD623D0685B9D449157DE51D3DB752973324";;
            juggler) EXPECTED="0C7858B726D1DE1C3C95404E4BB278B7AAF7A4A77EDEA785CAC31EA2961C876B";;
          esac
          # Optional operator-provided certificate must agree with the pinned fingerprint.
          if [ -n "$EXPECTED_CERT" ]; then
            PROVIDED="$(printf %s "$EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            [ "$PROVIDED" = "$EXPECTED" ] || { echo "::error::Input fingerprint differs from pinned certificate"; exit 1; }
          fi
          echo "APK signing certificate SHA-256: $ACTUAL"
          echo "Expected signing certificate SHA-256: $EXPECTED"
          [[ "$EXPECTED" =~ ^[0-9A-F]{64}$ ]] && [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::Signing certificate mismatch; APK not published"; exit 1; }
          INFO="$("$SDK/aapt" dump badging "$APK" | head -1)"
          echo "$INFO"
          [[ "$INFO" == *"name='$EXPECTED_PACKAGE'"* ]] || { echo "::error::Package mismatch"; exit 1; }
          VERSION="$(echo "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          CODE="$(echo "$INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]] && [[ "$CODE" =~ ^[0-9]+$ ]] || exit 1
          if [ "${{ github.event_name }}" = "push" ]; then
            APK_SHA="$(sha256sum "$APK" | cut -c1-12)"
            RELEASE_TAG="$APP-v$VERSION-build$CODE-src$APK_SHA"
          else
            RELEASE_TAG="$APP-v$VERSION-build$CODE"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          mkdir -p release
          cp "$APK" "release/$APP-v$VERSION-build$CODE.apk"
          sha256sum release/*.apk > "release/$APP-v$VERSION-build$CODE.apk.sha256"
          echo "APK_NAME=$APP-v$VERSION-build$CODE.apk" >> "$GITHUB_ENV"
      - name: Publish without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; verifying asset without overwriting"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "release/$APK_NAME" "release/$APK_NAME.sha256" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "Imported from private $SOURCE release $SOURCE_TAG; signing fingerprint checked. Source remains private."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$APK_NAME"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
